[project]
name = "styletts2-ukrainian-openai-tts-api"
version = "0"
description = ""
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "fastapi",
    "gradio-client",
    "python-dotenv",
    "soundfile",
    "uvicorn",
]

[tool.uv.workspace]
members = ["styletts2-ukrainian"]

[dependency-groups]
dev = [
    "pre-commit-uv",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = true
